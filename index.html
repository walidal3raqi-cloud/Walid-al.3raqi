<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#15221c;--mut:#5f6f67;--line:#dde4e0;--ac:#0e7a5c;--acs:#e1f3ec;--bad:#c2362b;--bads:#fbe7e4;--warn:#b7791f;--warns:#fdf1d8;--blu:#2563a8;--blus:#e3edf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#18231e;--ink:#e8f0ec;--mut:#9bb0a6;--line:#2a3a33;--ac:#3cc79b;--acs:#16342a;--bad:#ff7b6e;--bads:#3a1f1c;--warn:#f0b955;--warns:#3a2f14;--blu:#7db4ea;--blus:#1a2b3d}}
:root[data-theme="dark"]{--bg:#0f1714;--card:#18231e;--ink:#e8f0ec;--mut:#9bb0a6;--line:#2a3a33;--ac:#3cc79b;--acs:#16342a;--bad:#ff7b6e;--bads:#3a1f1c;--warn:#f0b955;--warns:#3a2f14;--blu:#7db4ea;--blus:#1a2b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--ac);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:19px;font-weight:800}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:none;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--acs);color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.k small{color:var(--mut);display:block}.k b{font-size:21px;font-weight:800}.k em{font-style:normal;font-size:12px;color:var(--mut);display:block}
.good{color:var(--ac)}.loss{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.b.s{background:var(--acs);color:var(--ac)}.b.d{background:var(--bads);color:var(--bad)}.b.x{padding:3px 9px;font-size:13px}
#lock{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;align-items:center;justify-content:center;flex-direction:column;gap:12px}a.b{text-decoration:none;display:inline-block}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.t-delivered{background:var(--acs);color:var(--ac)}.t-returned{background:var(--bads);color:var(--bad)}.t-shipping{background:var(--blus);color:var(--blu)}.t-cancelled{background:var(--warns);color:var(--warn)}
.alert{padding:10px 12px;border-radius:8px;margin-bottom:10px}
.alert.bad{background:var(--bads);color:var(--bad)}.alert.ok{background:var(--acs);color:var(--ac)}.alert.w{background:var(--warns);color:var(--warn)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:12px;background:var(--ac);border-radius:6px}.bar span{min-width:90px}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;overflow-x:auto;padding-top:10px}
.chart div{flex:1;min-width:46px;text-align:center;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;border-radius:5px 5px 0 0}
#inv{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:20px}
#inv .paper{max-width:520px;margin:0 auto;background:#fff;color:#111;padding:20px;border:1px solid #ccc}
@media print{body>*:not(#inv){display:none!important}#inv{position:static;padding:0}#inv .np{display:none}}

:root:root:root{--bg:#0a1311;--card:#111c1d;--ink:#eaf4f0;--mut:#8aa39b;--line:#1f3338;--ac:#34d399;--acs:#12382f;--bad:#f87171;--bads:#4a2428;--warn:#fbbf24;--warns:#4a3716;--blu:#60a5fa;--blus:#16304a}
header{background:none;color:var(--ink);padding:20px 16px 8px;justify-content:flex-start;gap:14px;max-width:1100px;margin:0 auto}
header h1{font-size:25px}header small{color:var(--mut)}
.logo{width:54px;height:54px;background:var(--ac);border-radius:22px 14px 20px 16px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:6px 14px;max-width:1100px;margin:0 auto}
.chip{background:var(--acs);color:var(--ac);border:0;border-radius:16px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.chip.o{background:none;border:1px solid var(--line);color:var(--ink)}.chip.w{background:var(--warns);color:var(--warn)}
.b{color:#05261c;border-radius:16px}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;background:#0d1819;border-top:1px solid var(--line);border-bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:15}
nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:6px 12px;min-width:74px;border-radius:14px}
nav button i{font-style:normal;font-size:20px}
main{padding-bottom:110px}
.card,.k{border-radius:22px}
input,select,textarea{border-radius:14px}
.grid{display:flex;overflow-x:auto;gap:12px;padding-bottom:6px}
.k{min-width:215px;flex:none;padding:18px}.k small{font-size:14px}.k b{font-size:28px;display:block;margin:12px 0 8px;color:var(--ac)}.k b.loss{color:var(--bad)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#145a47,#0f3d33);border:1px solid #1f7a60;border-radius:28px;padding:22px;margin:10px 0 18px}
.hero small{color:var(--ac)}.hero h2{margin:6px 0;font-size:28px}.hero p{margin:0;color:#b5d6cb}
.sec{font-size:22px;margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}.sec small{font-size:14px;color:var(--ac)}
.oc{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--ac);border-radius:26px;padding:18px;margin-bottom:14px}
.oc.s-returned{border-right-color:var(--bad)}.oc.s-shipping{border-right-color:var(--warn)}.oc.s-cancelled{border-right-color:var(--mut)}
.oh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.oh small,.og small{color:var(--mut);display:block}
.oid{font-size:22px;font-weight:600}
.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:12px;font-weight:600;font-size:13px}.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.t-shipping{background:var(--warns);color:var(--warn)}.t-cancelled{background:var(--line);color:var(--mut)}
.og{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 8px}.og b{font-size:17px}.amb{color:var(--warn)}
footer.sg{text-align:center;padding:24px 10px 110px;color:var(--mut)}footer.sg .a{color:var(--ac);letter-spacing:2px;font-size:17px}

.ic{display:inline-flex;width:46px;height:46px;border-radius:16px;background:var(--acs);align-items:center;justify-content:center;font-size:22px;float:left;flex:none}
.rc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bad);border-radius:22px;padding:16px;margin:14px 0}
.rc .ic{background:var(--bads);float:none}.rc small{display:block;color:var(--mut)}.rc b{font-size:30px;color:var(--bad);margin-inline-start:auto}
.rc.ok{border-color:var(--line)}.rc.ok b{color:var(--ac)}.rc.ok .ic{background:var(--acs)}

:root[data-theme="light"][data-theme]:root{--bg:#eef5f2;--card:#fff;--ink:#10231c;--mut:#5d7a70;--line:#d5e3dd;--ac:#0b946b;--acs:#dff5ec;--bad:#d33f3f;--bads:#fde4e4;--warn:#a96a0f;--warns:#fdf1d8;--blu:#2563a8;--blus:#e3edf8}
:root[data-theme="light"] nav{background:#fff}
:root[data-theme="light"] .hero{background:linear-gradient(135deg,#d6f3e8,#bfe9d8);border-color:#9bd9c3}
:root[data-theme="light"] .hero p{color:#3d6657}
:root[data-theme="light"] .b{color:#fff}

main,header,.chips,footer.sg{zoom:var(--z,.92)}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--acs);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--ac);overflow:hidden;flex:none}

:root[data-theme="light"][data-theme]:root{--ac:#046c4e;--mut:#3f564c;--warn:#7a4a00;--bad:#b42318;--acs:#d3f0e3;--line:#bfd2c9;--bads:#fbdcdc;--warns:#fbe9c2}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea{background:#fff;border-color:#a9bfb5;color:#10231c}
:root[data-theme="light"] .k small,:root[data-theme="light"] .og small,:root[data-theme="light"] .oh small{color:#3f564c}
::placeholder{color:var(--mut);opacity:.8}

.mr{display:flex;align-items:center;gap:14px;padding:12px 4px;cursor:pointer;border-radius:16px}.mr b{flex:1;font-weight:600;font-size:17px}.mr .ic{float:none}.mr.ms{padding-inline-start:56px}.mr.ms b{font-size:15px;font-weight:500}.mr .ch{color:var(--ac);font-size:22px}
.mr:active{background:var(--acs)}
.logo{background:none;border-radius:14px;object-fit:cover}
#lock{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;align-items:center;justify-content:center;flex-direction:column;gap:12px}

:root[data-theme="light"] .b.s{color:var(--ac)}:root[data-theme="light"] .b.d{color:var(--bad)}:root[data-theme="light"] .sg2 button.on{color:#fff}
.hb{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.hb small{font-size:11px;color:var(--mut)}
nav svg{width:26px;height:22px;display:block}nav button i{display:block;font-style:normal}
.sg2{display:flex;gap:6px;overflow-x:auto;margin:10px 0 14px}.sg2 button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}.sg2 button.on{background:var(--ac);color:#05261c;border-color:var(--ac)}
.br{border-inline-start:5px solid var(--bc);background:color-mix(in srgb,var(--bc) 10%,var(--card));border-radius:16px;padding:12px;margin:10px 0}.br .bh{display:flex;gap:8px;align-items:center;margin-bottom:4px}.br a.b{background:var(--bc);color:#fff}
.hero svg.cam{width:92px;height:auto;flex:none}

.dtw{position:relative;display:flex;gap:6px;align-items:center}.dtw input[data-dt]{flex:1;text-align:left;direction:ltr}.dtb{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit}.dth{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;inset-inline-end:0;bottom:0}
.cc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}.cc .ch1{display:flex;gap:12px;align-items:center}.cc .ch1 b{font-size:17px}.cc .st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;font-size:13px}.cc .st small{display:block;color:var(--mut)}
.demo{background:var(--acs);color:var(--ac);border-radius:16px;padding:10px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk label{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;color:var(--ink)}.chk input{width:auto}
</style>
</head>
